[project]
name = "pixera-mcp"
version = "0.2.0"
description = "MCP server: AV Stumpfl Pixera projection-mapping learning companion + marker-calibration advisor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LMXtinker" }]
keywords = ["mcp", "pixera", "projection-mapping", "av-stumpfl", "calibration"]
dependencies = [
    "mcp>=1.2.0,<2",  # mcp 2.x renamed FastMCP to MCPServer
    "numpy>=1.24",
]

[project.optional-dependencies]
# trimesh enables FBX/GLTF/PLY/STL mesh loading. Without it, only OBJ is supported
# (via the built-in fallback parser in meshio.py).
mesh = ["trimesh>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
pixera-mcp = "pixera_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixera_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/pixera_mcp/knowledge" = "pixera_mcp/knowledge"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
